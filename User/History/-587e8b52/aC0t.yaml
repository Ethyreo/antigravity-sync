name: creator_match
description: A cross-platform MVP for CreatorMatch using Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Backend
  supabase_flutter: ^2.3.0
  
  # UI & Animations
  flutter_card_swiper: ^7.0.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  
  # State Management
  provider: ^6.1.1
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
