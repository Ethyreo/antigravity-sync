<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Rift Runners - A 2.5D fantasy/sci-fi platformer where two heroes from parallel dimensions unite to save their worlds.">
    <title>Rift Runners | 2.5D Platformer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Quicksand:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <div id="loading-screen">
            <div class="loading-content">
                <h1 class="game-title">RIFT RUNNERS</h1>
                <div class="loading-bar-container">
                    <div class="loading-bar"></div>
                </div>
                <p class="loading-text">Loading dimensions...</p>
            </div>
        </div>
    </div>

    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- Game Scripts -->
    <script src="js/utils/Controls.js"></script>
    <script src="js/utils/DimensionManager.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/scenes/BootScene.js"></script>
    <script src="js/scenes/MenuScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/PauseScene.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
